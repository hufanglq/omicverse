# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the version of Python and other tools you might need
build:
  os: ubuntu-22.04
  tools:
    python: "3.10"
  jobs:
    # Downscale oversized embedded notebook figures on the ephemeral
    # checkout before Sphinx reads them. Shrinks the HTML output (and the
    # myst-nb render/write cost) without touching the notebooks in git.
    pre_build:
      - python omicverse_guide/docs/_scripts/downscale_notebook_images.py omicverse_guide/docs --max-px 900 --workers 4

submodules:
  include: all
  recursive: true

sphinx:
  configuration: omicverse_guide/docs/conf.py
  fail_on_warning: false

python:
  install:
  - requirements: requirements.txt
  - requirements: omicverse_guide/requirements.txt
